name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/spec-md-implementation-0k99yo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 정적 내보내기는 미들웨어를 지원하지 않으므로 빌드에서 제외
      - run: rm middleware.ts
      - run: npm run build
        env:
          STATIC_EXPORT: '1'
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
